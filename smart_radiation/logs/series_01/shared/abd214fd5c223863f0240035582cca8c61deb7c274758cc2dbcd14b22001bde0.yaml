/velocity_smoother:
  ros__parameters:
    /bond_disable_heartbeat_timeout: true
    autostart_node: false
    bond_heartbeat_period: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    enable_stamped_cmd_vel: false
    feedback: OPEN_LOOP
    max_accel:
    - 2.0
    - 0.0
    - 3.2
    max_decel:
    - -2.0
    - 0.0
    - -3.2
    max_velocity:
    - 1.5
    - 0.0
    - 2.5
    min_velocity:
    - -0.5
    - 0.0
    - -2.5
    odom_duration: 0.1
    odom_topic: odom
    qos_overrides:
      /clock:
        subscription:
          depth: 1
          durability: volatile
          history: keep_last
          reliability: best_effort
    scale_velocities: false
    smoothing_frequency: 10.0
    stamp_smoothed_velocity_with_smoothing_time: false
    start_type_description_service: true
    use_realtime_priority: false
    use_sim_time: true
    velocity_timeout: 1.0
