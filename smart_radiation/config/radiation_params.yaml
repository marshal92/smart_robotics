# Конфигурация параметров радиационной подсистемы (smart_radiation)
# Можно редактировать до запуска или менять на лету через ros2 param set

radiation_field_server:
  ros__parameters:
    d_noise: 50.0     # Порог отсечения фонового шума (мкЗв/ч или мЗв/ч в зависимости от карты)
    d_crit: 1000.0    # Критический порог дозы (штраф 100% -> C_max в Nav2 costmap)
    k: 10.0           # Крутизна сигмоидной функции штрафа

radiation_mapper:
  ros__parameters:
    width: 800        # Ширина новой карты по умолчанию (клеток)
    height: 800       # Высота новой карты по умолчанию (клеток)
    res: 0.05         # Разрешение (м/клетка)
    ox: -20.0         # Начало координат X (м)
    oy: -20.0         # Начало координат Y (м)

baseline_field_server:
  ros__parameters:
    radiation_threshold: 1000.0
    radiation_cost: 95

alara_speed_reflex_node:
  ros__parameters:
    rad_threshold: 30.0
    normal_speed_pct: 35.0
    boost_speed_pct: 100.0
