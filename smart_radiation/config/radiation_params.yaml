# Radiation subsystem parameters configuration (smart_radiation)
# Can be edited before launch or updated dynamically via ros2 param set

radiation_field_server:
  ros__parameters:
    d_noise: 50.0     # Background noise cutoff threshold (uSv/h or mSv/h depending on map)
    d_crit: 1000.0    # Critical dose threshold (100% penalty -> C_max in Nav2 costmap)
    k: 10.0           # Steepness of the sigmoid penalty function

radiation_mapper:
  ros__parameters:
    width: 800        # Default new map width (cells)
    height: 800       # Default new map height (cells)
    res: 0.05         # Resolution (m/cell)
    ox: -20.0         # Origin X (m)
    oy: -20.0         # Origin Y (m)

alara_speed_reflex_node:
  ros__parameters:
    rad_threshold: 30.0
    normal_speed_pct: 35.0
    boost_speed_pct: 100.0
